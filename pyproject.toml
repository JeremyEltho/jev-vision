[project]
name = "jev-vision"
version = "0.1.0"
description = "Confidence-gated object recognition: a fast detector handles the easy cases, TypeSafe's Jev model disambiguates the ambiguous ones."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Jeremy Eltho" }]
dependencies = [
    "requests>=2.31",
]

[project.optional-dependencies]
yolo = ["ultralytics>=8.2"]
dev = ["pytest>=8.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["jev_vision*"]
